name: CI

on:
  pull_request:
  push:
    branches: [main, develop-cybsync]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The tests start an in-memory MongoDB; cache its binary between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Test
        run: npm test

      # The build doesn't connect to MongoDB or Google, so no secrets are needed.
      - name: Build
        run: npm run build
